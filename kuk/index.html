<script>
AFRAME.registerComponent('touch-look', {

    init: function () {
        this.canvas = null;
        this.active = false;
        this.lastX = 0;
        this.lastY = 0;

        this.onDown = this.onDown.bind(this);
        this.onMove = this.onMove.bind(this);
        this.onUp = this.onUp.bind(this);

        this.el.sceneEl.addEventListener('renderstart', () => {
            this.canvas = this.el.sceneEl.canvas;

            this.canvas.addEventListener(
                'pointerdown', this.onDown
            );

            this.canvas.addEventListener(
                'pointermove', this.onMove
            );

            this.canvas.addEventListener(
                'pointerup', this.onUp
            );

            this.canvas.addEventListener(
                'pointercancel', this.onUp
            );
        });
    },

    onDown: function (e) {
        if (e.pointerType !== 'touch') return;

        this.active = true;
        this.lastX = e.clientX;
        this.lastY = e.clientY;

        this.canvas.setPointerCapture(e.pointerId);
        e.preventDefault();
    },

    onMove: function (e) {
        if (!this.active) return;

        const dx = e.clientX - this.lastX;
        const dy = e.clientY - this.lastY;

        this.lastX = e.clientX;
        this.lastY = e.clientY;

        const controles = this.el.components['look-controls'];

        if (!controles) return;

        const sensibilidad = 0.004;

        controles.yawObject.rotation.y -= dx * sensibilidad;

        controles.pitchObject.rotation.x -= dy * sensibilidad;

        controles.pitchObject.rotation.x = Math.max(
            -1.45,
            Math.min(1.45, controles.pitchObject.rotation.x)
        );

        e.preventDefault();
    },

    onUp: function () {
        this.active = false;
    },

    remove: function () {
        if (!this.canvas) return;

        this.canvas.removeEventListener('pointerdown', this.onDown);
        this.canvas.removeEventListener('pointermove', this.onMove);
        this.canvas.removeEventListener('pointerup', this.onUp);
        this.canvas.removeEventListener('pointercancel', this.onUp);
    }
});
</script>

<style>
#empujar {
    position: fixed;

    right: 20px;

<button id="empujar">EMPUJAR</button>

<script>
const jugador = document.querySelector("#jugador");
const camara = document.querySelector("#camara");

const movimiento = {
  forward: false,
  back: false,
  left: false,
  right: false
};

document.querySelectorAll("[data-move]").forEach(boton => {

  const direccion = boton.dataset.move;

  boton.addEventListener("pointerdown", e => {
    e.preventDefault();
    movimiento[direccion] = true;
    boton.setPointerCapture(e.pointerId);
  });

  const soltar = () => {
    movimiento[direccion] = false;
  };

  boton.addEventListener("pointerup", soltar);
  boton.addEventListener("pointercancel", soltar);
  boton.addEventListener("lostpointercapture", soltar);

});

const teclas = {
  w: "forward",
  s: "back",
  a: "left",
  d: "right"
};

window.addEventListener("keydown", e => {
  const direccion = teclas[e.key.toLowerCase()];
  if (direccion) movimiento[direccion] = true;
});

window.addEventListener("keyup", e => {
  const direccion = teclas[e.key.toLowerCase()];
  if (direccion) movimiento[direccion] = false;
});

function caminar() {

  const rotacion = camara.object3D.rotation.y;

  const velocidad = 0.045;

  let x = 0;
  let z = 0;

  const adelanteX = -Math.sin(rotacion);
  const adelanteZ = -Math.cos(rotacion);

  const derechaX = Math.cos(rotacion);
  const derechaZ = -Math.sin(rotacion);

  if (movimiento.forward) {
    x += adelanteX;
    z += adelanteZ;
  }

  if (movimiento.back) {
    x -= adelanteX;
    z -= adelanteZ;
  }

  if (movimiento.right) {
    x += derechaX;
    z += derechaZ;
  }

  if (movimiento.left) {
    x -= derechaX;
    z -= derechaZ;
  }

  const largo = Math.hypot(x, z);

  if (largo > 0) {
    jugador.object3D.position.x +=
      (x / largo) * velocidad;

    jugador.object3D.position.z +=
      (z / largo) * velocidad;
  }

  requestAnimationFrame(caminar);
}

caminar();
</script>


<script>
const discoGiratorio = document.querySelector("#disco");
const botonEmpujarDisco = document.querySelector("#empujar");

let velocidadGiro = 0;
let ultimoTiempoGiro = 0;

// APLICAR EMPUJE
function empujarDisco() {

    velocidadGiro += 3 + Math.random() * 3;

    velocidadGiro = Math.min(velocidadGiro, 9);

    botonEmpujarDisco.textContent = "¡EMPUJADO!";
}

// BOTON TACTIL
botonEmpujarDisco.addEventListener("click", () => {
    empujarDisco();
});

// TECLA E
window.addEventListener("keydown", e => {

    if (e.key.toLowerCase() === "e" && !e.repeat) {
        empujarDisco();
    }

});

// MOVIMIENTO DEL DISCO
function actualizarGiro(tiempo) {

    if (!ultimoTiempoGiro) {
        ultimoTiempoGiro = tiempo;
    }

    const delta = Math.min(
        (tiempo - ultimoTiempoGiro) / 1000,
        0.05
    );

    ultimoTiempoGiro = tiempo;

    if (velocidadGiro > 0.01) {

        discoGiratorio.object3D.rotation.x +=
            velocidadGiro * delta;

        velocidadGiro *= Math.exp(-0.65 * delta);

    } else {
        velocidadGiro = 0;
    }

    requestAnimationFrame(actualizarGiro);
}

requestAnimationFrame(actualizarGiro);
</script>
